<% password_digest = BCrypt::Password.create("password") %>

one:
  email_address: one@example.com
  password_digest: <%= password_digest %>
  organization: one

# Deliberately a different organization: the isolation tests depend on two
# accounts that cannot see each other's libraries.
two:
  email_address: two@example.com
  password_digest: <%= password_digest %>
  organization: two
