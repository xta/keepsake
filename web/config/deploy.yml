# Kamal base configuration — GENERIC ON PURPOSE.
#
# No servers, domains, registry accounts, ssh keys or credentials belong in this
# file. It is committed, and anyone cloning this repo should be able to deploy
# their own instance without editing it.
#
# Real values live in a destination file, config/deploy.<destination>.yml, which
# is gitignored and merged over this one:
#
#     kamal deploy -d production
#
# Copy config/deploy.example.yml to get started. Secrets come from
# .kamal/secrets (also gitignored); see .kamal/secrets.example.

service: keepsake

# ghcr.io requires an owner namespace: ghcr.io/<owner>/<image>. Pushing a
# bare name gets a 400 from the registry, so the destination file overrides
# this with your own account or organisation.
image: REPLACE_ME/keepsake

# Overridden per destination.
servers:
  web:
    - REPLACE_ME

proxy:
  ssl: true
  # kamal-proxy routes by Host header, so an app is reachable only at the
  # hostnames listed in the destination file. A request to the bare server IP
  # matches nothing and gets a 404 -- which is why co-tenanting several apps on
  # one machine does not widen anything.
  hosts:
    - REPLACE_ME
  # The Dockerfile serves on 80 via Thruster.
  app_port: 80
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: REPLACE_ME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  # Build locally and push. A small server should not be spending its memory
  # compiling assets, and the Vite stage is the expensive part.
  arch: amd64

env:
  secret:
    - RAILS_MASTER_KEY
    # Solid Cache, Queue and Cable each use their own database on the same
    # server; all four URLs are derived from one password in .kamal/secrets.
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
  clear:
    # Solid Queue runs inside Puma rather than as its own container: this app
    # has no jobs in v1, and a second container per app does not pay for itself
    # on a shared server.
    SOLID_QUEUE_IN_PUMA: true

# No volumes. Nothing is written to disk -- every byte of media lives in the
# user's own bucket, and the catalog is a cache in Postgres. If a volume ever
# appears here, something has gone wrong.

accessories:
  db:
    image: postgres:18
    host: REPLACE_ME
    # Deliberately no `port:`. Postgres is reachable only on the private Docker
    # network, as <service>-db. Publishing a port would expose it to every
    # interface on the host, which is the single most common way a small
    # deployment gets owned.
    env:
      clear:
        POSTGRES_DB: keepsake_production
        POSTGRES_USER: keepsake
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres:18 mounts /var/lib/postgresql, NOT /var/lib/postgresql/data --
      # that changed in 18, and the old path silently writes outside the volume.
      - data:/var/lib/postgresql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  invite: app exec --reuse "bin/rails keepsake:invite"
