[project]
name = "keepsake-cli"
version = "0.1.0"
description = "Manage keepsake libraries in object storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "python-ulid>=3.0",
    "rich>=13.0",
    "textual>=1.0",
]

[project.scripts]
keepsake = "keepsake.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepsake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
