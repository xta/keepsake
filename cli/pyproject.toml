[project]
name = "keepsake-cli"
version = "0.1.0"
description = "Manage keepsake libraries in object storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "textual>=1.0",
    # Thumbnails in the editor. Picks the best the terminal offers -- Kitty's
    # graphics protocol, sixel, or a half-block mosaic -- so it degrades on its
    # own rather than needing configuration.
    #
    # It requires Python 3.12, and this project supports 3.11 (see the UUIDv7
    # note in models.py), so it is installed only where it can be. The import
    # in tui/app.py is guarded to match: on 3.11 everything works except the
    # preview pane, which is the right thing to lose over a picture.
    "textual-image[textual]>=0.13; python_version >= '3.12'",
]

[project.scripts]
keepsake = "keepsake.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepsake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
